<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mercado de Aracaju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D0500;overflow:hidden;font-family:'Nunito',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
canvas{display:block}
#loading{position:fixed;inset:0;background:linear-gradient(160deg,#1a0800,#0D0500);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:200;transition:opacity .5s ease}
#loading h1{color:#FEF3C7;font-size:1.8rem;font-weight:900;font-family:'Nunito',sans-serif;text-shadow:0 2px 20px rgba(245,166,35,.4)}
#loading p{color:#D4A574;font-family:'Nunito',sans-serif;font-size:.95rem}
.spinner{width:40px;height:40px;border:4px solid rgba(245,166,35,.2);border-top-color:#F5A623;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading">
  <div style="font-size:4rem;line-height:1">🏪</div>
  <h1>Mercado de Aracaju</h1>
  <div class="spinner"></div>
  <p>Preparando a banca...</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
// ═══════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════
const PRODUCTS=[
  {id:'caranguejo',name:'Caranguejo',  emoji:'🦀',sell:12,restockCost:5, restockTime:9000,tint:0xDC2626,hex:'#DC2626'},
  {id:'sururu',    name:'Sururu',      emoji:'🐚',sell:8, restockCost:3, restockTime:6000,tint:0x0891B2,hex:'#0891B2'},
  {id:'tapioca',   name:'Tapioca',     emoji:'🫓',sell:5, restockCost:2, restockTime:4000,tint:0xD97706,hex:'#D97706'},
  {id:'goma',      name:'Bolo de Goma',emoji:'🧁',sell:9, restockCost:4, restockTime:7000,tint:0x7C3AED,hex:'#7C3AED'},
  {id:'paolo',     name:'Pão de Ló',   emoji:'🍰',sell:11,restockCost:5, restockTime:8000,tint:0xDB2777,hex:'#DB2777'},
  {id:'doce',      name:'Doce de Leite',emoji:'🍮',sell:7,restockCost:3, restockTime:5500,tint:0x92400E,hex:'#92400E'},
];
const NAMES=['Dona Maria','Seu João','Professora Ana','Turista Carlos','Vovó Rosa','Estudante Pedro','Dona Graça','Seu Zé','Visitante Mariana','Seu Antônio'];
const FLAG_COLORS=[0xEF4444,0x3B82F6,0x22C55E,0xF59E0B,0x8B5CF6,0xEC4899,0x14B8A6,0xF97316];
const SKINS=['#F5CBA7','#D4A574','#C68642','#A0522D'];
const SHIRTS=['#3B82F6','#22C55E','#EF4444','#8B5CF6','#F97316','#0891B2'];
const MAX_STK=5,INIT_STK=5,GAME_SECS=90;

// ═══════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════
let sfxCtx=null;
function getSFX(){if(!sfxCtx)sfxCtx=new(window.AudioContext||window.webkitAudioContext)();if(sfxCtx.state==='suspended')sfxCtx.resume();return sfxCtx;}
function tone(f,type,vol,dur,f2){try{const c=getSFX(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(f,c.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur*.8);g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.start(c.currentTime);o.stop(c.currentTime+dur);}catch(e){}}
function playSell(rush,combo){const f=rush?880:660;tone(f,'sine',.3,.25,combo?f*1.6:f*1.2);if(combo)setTimeout(()=>tone(f*1.5,'sine',.2,.2),120);}
function playFail(){tone(220,'sawtooth',.2,.3,100);}
function playRestock(){tone(400,'triangle',.2,.15,500);}
function playCombo(){tone(523,'sine',.3,.1);setTimeout(()=>tone(659,'sine',.3,.1),100);setTimeout(()=>tone(784,'sine',.3,.2),200);}
function playEnd(){tone(300,'sawtooth',.3,.4,150);setTimeout(()=>tone(200,'sine',.3,.6,100),300);}

// ═══════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════
function h2n(h){return parseInt(h.replace('#',''),16);}

// Draw colonial market background (shared)
function drawMarketBG(g,W,H){
  g.fillGradientStyle(0x1a0500,0x1a0500,0x2d0f00,0x2d0f00,1);
  g.fillRect(0,0,W,H*.65);
  g.fillStyle(0xF0E0B8,1);g.fillRect(0,H*.22,W,H*.42);
  const nA=Math.max(3,Math.ceil(W/110));
  for(let i=0;i<nA;i++){
    const aw=W/nA-16,ax=i*(W/nA)+8,ah=85,ay=H*.24,ar=aw/2;
    g.fillStyle(0x93C5FD,.85);g.fillRect(ax,ay+ar,aw,ah-ar);
    g.fillStyle(0xBFDBFE,.5);g.fillCircle(ax+aw/2,ay+ar,aw/2);
    g.lineStyle(3,0xC8A450,1);
    g.beginPath();g.moveTo(ax,ay+ar);g.lineTo(ax,ay+ah);g.lineTo(ax+aw,ay+ah);g.lineTo(ax+aw,ay+ar);g.strokePath();
    g.beginPath();g.arc(ax+aw/2,ay+ar,aw/2,Math.PI,0,false);g.strokePath();
    g.fillStyle(0xC8A450,1);g.fillRect(ax-3,ay+ah-2,aw+6,5);
  }
  g.lineStyle(1.5,0x000000,.4);g.beginPath();g.moveTo(0,H*.46);g.lineTo(W,H*.46);g.strokePath();
  g.fillStyle(0x7C4A1E,1);g.fillRect(0,H*.60,W,10);
  g.fillStyle(0xC8A450,1);g.fillRect(0,H*.60,W,4);
  g.fillStyle(0xD4AA7D,1);g.fillRect(0,H*.605,W,H*.72-H*.605);
  g.lineStyle(.5,0xAA8060,.4);
  for(let x=0;x<W;x+=60){g.beginPath();g.moveTo(x,H*.605);g.lineTo(x,H*.72);g.strokePath();}
  for(let y=H*.605;y<H*.72;y+=44){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.strokePath();}
  g.fillStyle(0x1A0800,1);g.fillRect(0,H*.72,W,H*.28);
  g.fillStyle(0xF5A623,1);g.fillRect(0,H*.72,W,3);
}

function drawFlagBanner(g,W,H,offset){
  g.clear();
  const ry=H*.46;
  for(let i=-1;(i-1)*32<W;i++){
    const fx=((i*32)+offset)%(W+64)-32;
    const sw=Math.sin(offset*.04+i*.9)*2.5;
    g.fillStyle(FLAG_COLORS[((i%FLAG_COLORS.length)+FLAG_COLORS.length)%FLAG_COLORS.length],1);
    g.fillTriangle(fx,ry+sw,fx+14,ry+sw,fx+7,ry+20+sw);
  }
}

// ═══════════════════════════════════════════
//  PRELOAD
// ═══════════════════════════════════════════
class PreloadScene extends Phaser.Scene{
  constructor(){super('Preload');}
  create(){
    document.fonts.ready.then(()=>{
      this.genTextures();
      document.getElementById('loading').style.opacity='0';
      setTimeout(()=>{
        document.getElementById('loading').style.display='none';
        this.scene.start('Menu');
      },500);
    });
  }
  genTextures(){
    // Coin
    const cg=this.make.graphics({add:false});
    cg.fillStyle(0xFBBF24,1);cg.fillCircle(8,8,8);
    cg.fillStyle(0xF59E0B,1);cg.fillCircle(8,8,6);
    cg.lineStyle(1.5,0x92400E,1);cg.strokeCircle(8,8,7);
    cg.generateTexture('coin',16,16);cg.destroy();
    // Star
    const sg=this.make.graphics({add:false});
    sg.fillStyle(0xFEF08A,1);
    this.drawStar(sg,7,7,7,3,5);
    sg.generateTexture('star',14,14);sg.destroy();
    // Spark
    const pk=this.make.graphics({add:false});
    pk.fillStyle(0xFFFFFF,1);pk.fillCircle(4,4,4);
    pk.generateTexture('spark',8,8);pk.destroy();
  }
  drawStar(g,cx,cy,or,ir,pts){
    g.beginPath();
    for(let i=0;i<pts*2;i++){const r=i%2===0?or:ir,a=(i*Math.PI/pts)-Math.PI/2;if(i===0)g.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));else g.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}
    g.closePath();g.fillPath();
  }
}

// ═══════════════════════════════════════════
//  MENU SCENE
// ═══════════════════════════════════════════
class MenuScene extends Phaser.Scene{
  constructor(){super('Menu');}
  create(){
    this.cameras.main.fadeIn(400,0,0,0);
    const W=this.scale.width,H=this.scale.height;
    this.flagOffset=0;
    // Static BG
    const bg=this.add.graphics();
    drawMarketBG(bg,W,H);
    // Animated flags
    this.flagGfx=this.add.graphics().setDepth(2);
    drawFlagBanner(this.flagGfx,W,H,0);
    // Title panel
    this.buildTitleCard(W,H);
    // Product preview
    this.buildProductGrid(W,H);
    // Instructions
    this.buildInstructions(W,H);
    // Start button
    this.buildStartBtn(W,H);
  }

  buildTitleCard(W,H){
    const pw=Math.min(340,W-24),ph=70,px=(W-pw)/2,py=6;
    const g=this.add.graphics().setDepth(5);
    g.fillStyle(0x000000,.4);g.fillRoundedRect(px+4,py+4,pw,ph,18);
    g.fillGradientStyle(0x2D1200,0x2D1200,0x1A0800,0x1A0800,1);g.fillRoundedRect(px,py,pw,ph,18);
    g.lineStyle(2,0xF5A623,.9);g.strokeRoundedRect(px,py,pw,ph,18);
    g.fillStyle(0xF5A623,1);g.fillRect(px+16,py+ph-5,pw-32,3);
    this.add.text(W/2,py+20,'🏪  Mercado de Aracaju',{fontFamily:'Nunito',fontSize:'21px',fontStyle:'bold',color:'#FEF3C7',stroke:'#2D1200',strokeThickness:4}).setOrigin(.5).setDepth(6);
    this.add.text(W/2,py+44,'Mercado Antônio Franco · Sergipe',{fontFamily:'Nunito',fontSize:'12px',color:'#D4A574'}).setOrigin(.5).setDepth(6);
    this.add.text(W/2,py+62,'⏱ 90 segundos para vender o máximo!',{fontFamily:'Nunito',fontSize:'11px',fontStyle:'bold',color:'#FBB724'}).setOrigin(.5).setDepth(6);
  }

  buildProductGrid(W,H){
    const cols=3,mg=12,gap=8;
    const cw=Math.floor((W-mg*2-gap*(cols-1))/cols);
    const ch=160;
    const startX=mg,startY=88;
    const panW=W-mg*2+4,panH=ch+gap+ch+40,panX=mg-2,panY=78;
    const g=this.add.graphics().setDepth(5);
    g.fillStyle(0x000000,.4);g.fillRoundedRect(panX+3,panY+3,panW,panH,16);
    g.fillStyle(0x1A0800,.92);g.fillRoundedRect(panX,panY,panW,panH,16);
    g.lineStyle(1.5,0xF5A623,.3);g.strokeRoundedRect(panX,panY,panW,panH,16);
    this.add.text(W/2,startY-8,'🛍️  PRODUTOS DA BANCA',{fontFamily:'Nunito',fontSize:'11px',fontStyle:'bold',color:'#FBB724'}).setOrigin(.5).setDepth(6);
    PRODUCTS.forEach((p,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const sx=startX+col*(cw+gap),sy=startY+8+row*(ch+gap);
      const gc=this.add.graphics().setDepth(6);
      gc.fillStyle(0x000000,.35);gc.fillRoundedRect(sx+3,sy+3,cw,ch,12);
      gc.fillGradientStyle(p.tint,p.tint,0x150800,0x150800,.8);gc.fillRoundedRect(sx,sy,cw,ch,12);
      gc.lineStyle(2,p.tint,.8);gc.strokeRoundedRect(sx,sy,cw,ch,12);
      const efs=Math.min(32,cw*.35);
      this.add.text(sx+cw/2,sy+ch*.35,p.emoji,{fontSize:`${efs}px`}).setOrigin(.5).setDepth(7);
      const nfs=Math.max(9,Math.min(13,cw*.145));
      this.add.text(sx+cw/2,sy+ch*.62,p.name,{fontFamily:'Nunito',fontSize:`${nfs}px`,fontStyle:'bold',color:'#F1F5F9',wordWrap:{width:cw-4},align:'center'}).setOrigin(.5,0).setDepth(7);
      this.add.text(sx+cw/2,sy+ch-10,`R$ ${p.sell}`,{fontFamily:'Nunito',fontSize:`${nfs+1}px`,fontStyle:'bold',color:'#4ADE80'}).setOrigin(.5,1).setDepth(7);
    });
  }

  buildInstructions(W,H){
    const lines=['🕹️  Toque na banca certa para vender','⚡  Clientes Rush pagam o dobro!','🔥  3+ seguidas = Bônus Combo','📦  Estoque zerou? Toque para repor'];
    const pw=Math.min(W-24,360),px=(W-pw)/2,py=452,ph=lines.length*18+14;
    const g=this.add.graphics().setDepth(5);
    g.fillStyle(0xFFFFFF,.06);g.fillRoundedRect(px,py,pw,ph,10);
    lines.forEach((l,i)=>this.add.text(W/2,py+8+i*18,l,{fontFamily:'Nunito',fontSize:'11px',color:'#CBD5E1'}).setOrigin(.5,0).setDepth(6));
  }

  buildStartBtn(W,H){
    const bw=226,bh=56,bx=(W-bw)/2,by=544;
    const g=this.add.graphics().setDepth(10).setInteractive(new Phaser.Geom.Rectangle(bx,by,bw,bh),Phaser.Geom.Rectangle.Contains);
    g.fillStyle(0x000000,.5);g.fillRoundedRect(bx+4,by+4,bw,bh,29);
    g.fillGradientStyle(0xF5A623,0xF5A623,0x92400E,0x92400E,1);g.fillRoundedRect(bx,by,bw,bh,29);
    g.lineStyle(2,0xFDE68A,.8);g.strokeRoundedRect(bx,by,bw,bh,29);
    const txt=this.add.text(W/2,by+bh/2,'Abrir Banca! 🏪',{fontFamily:'Nunito',fontSize:'20px',fontStyle:'bold',color:'#FFF',stroke:'#92400E',strokeThickness:3}).setOrigin(.5).setDepth(11);
    this.tweens.add({targets:txt,scaleX:1.04,scaleY:1.04,yoyo:true,repeat:-1,duration:720,ease:'Sine.easeInOut'});
    const startGame=()=>{
      this.tweens.add({targets:[g,txt],scaleX:.97,scaleY:.97,duration:80,yoyo:true,onComplete:()=>{
        this.cameras.main.fade(350,0,0,0,false,(c,t)=>{if(t===1)this.scene.start('Game');});
      }});
    };
    g.on('pointerdown',startGame);
    txt.setInteractive().on('pointerdown',startGame);
  }

  update(){
    this.flagOffset+=.6;
    drawFlagBanner(this.flagGfx,this.scale.width,this.scale.height,this.flagOffset);
  }
}

// ═══════════════════════════════════════════
//  FLOAT TEXT
// ═══════════════════════════════════════════
class FloatText{
  constructor(scene,text,x,y,color,size){
    this.txt=scene.add.text(x,y,text,{fontFamily:'Nunito',fontSize:`${size}px`,fontStyle:'bold',color,stroke:'#000',strokeThickness:3}).setOrigin(.5).setDepth(80);
    this.life=1;this.decay=0.00105;this.alive=true;
  }
  update(dt){
    this.life-=dt*this.decay;
    this.txt.y-=1.4*(dt/16);
    this.txt.setAlpha(Math.max(0,this.life));
    if(this.life<=0){this.txt.destroy();this.alive=false;}
  }
}

// ═══════════════════════════════════════════
//  CUSTOMER
// ═══════════════════════════════════════════
class Customer{
  constructor(scene,prodIdx){
    this.scene=scene;
    this.prodIdx=prodIdx;
    this.product=PRODUCTS[prodIdx];
    const W=scene.scale.width,H=scene.scale.height;
    this.x=W+90;
    this.y=H*.59-10+Math.random()*18;
    this.stopX=W*.28+Math.random()*(W*.18);
    this.state='walk';
    this.waitTime=11000;this.waitMax=11000;
    this.isRush=Math.random()<.22;
    this.sc=.88+Math.random()*.22;
    this.speed=1.4+Math.random()*.9;
    this.frame=0;
    this.skin=h2n(SKINS[Math.floor(Math.random()*SKINS.length)]);
    this.shirt=h2n(SHIRTS[Math.floor(Math.random()*SHIRTS.length)]);
    this.hat=[0xF59E0B,0xDC2626,0x1D4ED8,0x065F46,null,null][Math.floor(Math.random()*6)];
    this.name=NAMES[Math.floor(Math.random()*NAMES.length)];
    this.msgTxt='';this.msgTimer=0;
    this.alive=true;
    // Graphics
    this.gfx=scene.add.graphics().setDepth(20);
    // Persistent text objects
    const p=this.product;
    this.tEmoji=scene.add.text(0,0,p.emoji,{fontSize:'40px'}).setOrigin(.5).setDepth(28).setVisible(false);
    this.tName=scene.add.text(0,0,p.name,{fontFamily:'Nunito',fontSize:'18px',fontStyle:'bold',color:'#1A0A00'}).setOrigin(.5).setDepth(28).setVisible(false);
    this.tPrice=scene.add.text(0,0,'',{fontFamily:'Nunito',fontSize:'16px',fontStyle:'bold',color:'#15803D'}).setOrigin(.5).setDepth(28).setVisible(false);
    this.tMsg=scene.add.text(0,0,'',{fontFamily:'Nunito',fontSize:'13px',fontStyle:'bold',color:'#FFF',stroke:'#000',strokeThickness:2}).setOrigin(.5).setDepth(28).setVisible(false);
    this.tRush=this.isRush?scene.add.text(0,0,'⚡ RUSH ×2',{fontFamily:'Nunito',fontSize:'13px',fontStyle:'bold',color:'#F97316',backgroundColor:'rgba(0,0,0,.7)',padding:{x:5,y:2}}).setOrigin(.5).setDepth(28).setVisible(false):null;
  }

  update(dt,now){
    this.frame+=dt*.055;
    if(this.state==='walk'){
      this.x-=this.speed*(dt/16);
      if(this.x<=this.stopX){this.x=this.stopX;this.state='wait';}
    }else if(this.state==='wait'){
      this.waitTime-=dt;
      if(this.waitTime<=0){this.state='sad';this.speed=2.4;this.msgTxt='😔 Sem produto!';this.msgTimer=1800;this.scene.events.emit('custLeave',false);playFail();}
    }else if(this.state==='ok'||this.state==='sad'){
      this.x-=this.speed*1.3*(dt/16);
    }
    if(this.msgTimer>0)this.msgTimer-=dt;
    // Update text objects
    const BY=-260;
    if(this.state==='wait'){
      const px=this.x,py=this.y;
      this.tEmoji.setPosition(px,py+BY+45).setVisible(true);
      this.tName.setPosition(px,py+BY+78).setVisible(true);
      const pv=this.isRush?`R$${this.product.sell*2} ⚡`:`R$${this.product.sell}`;
      this.tPrice.setText(pv).setColor(this.isRush?'#DC2626':'#15803D').setPosition(px,py+BY+104).setVisible(true);
      if(this.tRush)this.tRush.setPosition(px,py+BY-10).setVisible(true);
    }else{
      this.tEmoji.setVisible(false);this.tName.setVisible(false);
      this.tPrice.setVisible(false);if(this.tRush)this.tRush.setVisible(false);
    }
    if(this.msgTimer>0){
      this.tMsg.setText(this.msgTxt).setPosition(this.x,this.y-155).setAlpha(Math.min(1,this.msgTimer/400)).setVisible(true);
    }else{this.tMsg.setVisible(false);}
    if(this.x<-220){this.alive=false;this.destroyObjs();return;}
    this.draw(now);
  }

  draw(now){
    const g=this.gfx;g.clear();
    g.x=this.x;g.y=this.y;
    const sc=this.sc,la=this.state==='walk'?Math.sin(this.frame)*.36:0;
    // Shadow
    g.fillStyle(0x000000,.18);g.fillEllipse(0,4*sc,36*sc,9*sc);
    // Feet
    g.fillStyle(0x1a0a00,1);
    g.fillEllipse(-8*sc+la*5*sc,32*sc,13*sc,6*sc);
    g.fillEllipse( 8*sc-la*5*sc,32*sc,13*sc,6*sc);
    // Legs
    g.lineStyle(10*sc,this.skin,1);
    g.beginPath();g.moveTo(-4*sc,0);g.lineTo(-8*sc+la*8*sc,28*sc);g.strokePath();
    g.beginPath();g.moveTo( 4*sc,0);g.lineTo( 8*sc-la*8*sc,28*sc);g.strokePath();
    // Body
    g.fillStyle(this.shirt,1);g.fillEllipse(0,-14*sc,28*sc,36*sc);
    // Shopping bag
    g.fillStyle(0xFBBF24,1);g.fillRoundedRect(13*sc,-30*sc,15*sc,20*sc,4*sc);
    g.lineStyle(2*sc,0x92400E,1);
    // Bag handle drawn as arc (bezierCurveTo not available in this build)
    g.beginPath();g.arc(20.5*sc,-30*sc,4.5*sc,Math.PI,0,false);g.strokePath();
    // Arms (swing via offset, no rotation)
    const aSwing=Math.sin(this.frame)*.3;
    g.lineStyle(9*sc,this.skin,1);
    g.beginPath();g.moveTo(-10*sc,-10*sc);g.lineTo(-18*sc-aSwing*8*sc,-30*sc);g.strokePath();
    g.beginPath();g.moveTo( 10*sc,-10*sc);g.lineTo( 18*sc+aSwing*8*sc,-30*sc);g.strokePath();
    // Head
    g.fillStyle(this.skin,1);g.fillCircle(0,-55*sc,16*sc);
    // Hair/hat
    if(this.hat){
      g.fillStyle(this.hat,1);g.fillEllipse(0,-68*sc,36*sc,10*sc);g.fillRect(-10*sc,-80*sc,20*sc,14*sc);
    }else{
      g.fillStyle(0x2d1b00,1);g.fillCircle(0,-68*sc,10*sc);
    }
    // Eyes
    g.fillStyle(0x2d1b00,1);g.fillCircle(-5*sc,-57*sc,2.5*sc);g.fillCircle(5*sc,-57*sc,2.5*sc);
    g.fillStyle(0xFFFFFF,.8);g.fillCircle(-4*sc,-58*sc,sc);g.fillCircle(6*sc,-58*sc,sc);
    // Mouth
    g.lineStyle(2.5*sc,0x333333,1);
    if(this.state==='ok'){g.beginPath();g.arc(0,-55*sc,6*sc,.1,Math.PI-.1,false);g.strokePath();}
    else if(this.state==='sad'){g.beginPath();g.arc(0,-51*sc,5*sc,Math.PI+.2,-.2,false);g.strokePath();}
    else{g.beginPath();g.arc(0,-55*sc,5*sc,.2,Math.PI-.2,false);g.strokePath();}
    // Speech bubble
    if(this.state==='wait'){
      const u=this.waitTime/this.waitMax;
      const bw=190,bh=152,bx=-95,by=-260;
      g.fillStyle(0x000000,.5);g.fillRoundedRect(bx+5,by+5,bw,bh,16);
      g.fillStyle(0xFFFBF0,1);g.fillTriangle(-14,by+bh,-4,by+bh+20,10,by+bh);
      g.fillStyle(0xFFFBF0,1);g.fillRoundedRect(bx,by,bw,bh,16);
      g.lineStyle(3,this.isRush?0xF97316:0xD97706,1);g.strokeRoundedRect(bx,by,bw,bh,16);
      // Timer bar
      const barW=bw-20;
      g.fillStyle(0xE5E7EB,1);g.fillRoundedRect(bx+10,by+bh-18,barW,8,4);
      g.fillStyle(u>.5?0x22C55E:u>.25?0xF59E0B:0xEF4444,1);g.fillRoundedRect(bx+10,by+bh-18,barW*u,8,4);
    }
  }

  destroyObjs(){
    if(this.gfx)this.gfx.destroy();
    [this.tEmoji,this.tName,this.tPrice,this.tMsg,this.tRush].forEach(t=>{if(t)t.destroy();});
  }
}

// ═══════════════════════════════════════════
//  GAME SCENE
// ═══════════════════════════════════════════
class GameScene extends Phaser.Scene{
  constructor(){super('Game');}
  init(){
    this.money=0;this.sales=0;this.combo=0;this.maxCombo=0;
    this.timerMs=GAME_SECS*1000;
    this.stock=PRODUCTS.map(()=>INIT_STK);
    this.rstProg=PRODUCTS.map(()=>0);
    this.customers=[];this.floats=[];
    this.spawnCooldown=2200;this.running=false;
  }

  create(){
    const W=this.scale.width,H=this.scale.height;
    // Fade in visually, start game after 450ms regardless
    this.cameras.main.fadeIn(400,0,0,0);
    this.time.delayedCall(450,()=>{this.running=true;});
    // Static BG
    this.bgGfx=this.add.graphics().setDepth(0);
    drawMarketBG(this.bgGfx,W,H);
    // Animated flags
    this.flagGfx=this.add.graphics().setDepth(1);this.flagOffset=0;
    drawFlagBanner(this.flagGfx,W,H,0);
    // Vendor
    this.vendorGfx=this.add.graphics().setDepth(10);
    // Stalls
    this.stallGfx=this.add.graphics().setDepth(50);
    this.stallEmojis=[];this.stallNames=[];this.stallPrices=[];this.stallZones=[];
    this.createStalls(W,H);
    // HUD
    this.createHUD(W,H);
    // Particles
    this.coinEmit=this.add.particles(0,0,'coin',{speed:{min:120,max:260},angle:{min:220,max:320},scale:{start:1.4,end:0},alpha:{start:1,end:0},lifespan:{min:500,max:800},gravityY:360,emitting:false}).setDepth(70);
    this.starEmit=this.add.particles(0,0,'star',{speed:{min:80,max:200},angle:{min:200,max:340},scale:{start:1.2,end:0},alpha:{start:1,end:0},lifespan:{min:600,max:900},gravityY:220,emitting:false}).setDepth(71);
    this.sparkEmit=this.add.particles(0,0,'spark',{speed:{min:40,max:140},angle:{min:0,max:360},scale:{start:.8,end:0},alpha:{start:1,end:0},lifespan:{min:300,max:600},gravityY:0,emitting:false}).setDepth(69);
    // Events
    this.events.on('custLeave',(ok)=>{if(!ok){this.combo=0;this.updateComboHUD();}});
  }

  createStalls(W,H){
    const cols=3,mg=8,gap=6;
    const aY=H*.72+4,aH=H-aY-4;
    const cw=Math.floor((W-mg*2-gap*(cols-1))/cols);
    const ch=Math.floor((aH-gap)/2);
    this.sLayout={cols,mg,gap,cw,ch,aY};
    PRODUCTS.forEach((p,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const sx=mg+col*(cw+gap),sy=aY+row*(ch+gap);
      const nfs=Math.max(9,Math.min(13,cw*.145));
      const efs=Math.min(32,cw*.36);
      const em=this.add.text(sx+cw/2,sy+ch*.38,p.emoji,{fontSize:`${efs}px`}).setOrigin(.5).setDepth(52);
      const nm=this.add.text(sx+cw/2,sy+ch*.68,p.name,{fontFamily:'Nunito',fontSize:`${nfs}px`,fontStyle:'bold',color:'#F1F5F9',wordWrap:{width:cw-4},align:'center'}).setOrigin(.5,0).setDepth(52);
      const pr=this.add.text(sx+cw/2,sy+ch-10,`R$ ${p.sell}`,{fontFamily:'Nunito',fontSize:`${nfs+1}px`,fontStyle:'bold',color:'#4ADE80'}).setOrigin(.5,1).setDepth(52);
      this.stallEmojis.push(em);this.stallNames.push(nm);this.stallPrices.push(pr);
      const zone=this.add.zone(sx+cw/2,sy+ch/2,cw,ch).setInteractive({useHandCursor:true}).setDepth(60);
      zone.on('pointerdown',()=>this.tapStall(i));
      this.stallZones.push(zone);
    });
  }

  updateStalls(){
    const g=this.stallGfx;g.clear();
    const{cols,mg,gap,cw,ch,aY}=this.sLayout;
    PRODUCTS.forEach((p,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const sx=mg+col*(cw+gap),sy=aY+row*(ch+gap);
      const full=this.stock[i]>0,rp=this.rstProg[i]/p.restockTime;
      g.fillStyle(0x000000,.4);g.fillRoundedRect(sx+3,sy+3,cw,ch,12);
      if(full){g.fillGradientStyle(p.tint,p.tint,0x150800,0x150800,.78);}else{g.fillStyle(0x1E293B,1);}
      g.fillRoundedRect(sx,sy,cw,ch,12);
      g.lineStyle(full?2.5:1.5,full?p.tint:0x64748B,full?.9:.5);g.strokeRoundedRect(sx,sy,cw,ch,12);
      this.stallEmojis[i].setAlpha(full?1:.3);
      this.stallNames[i].setColor(full?'#F1F5F9':'#64748B');
      this.stallPrices[i].setText(full?`R$ ${p.sell}`:'VAZIO').setColor(full?'#4ADE80':'#EF4444');
      // Stock dots
      const dr=Math.min(5,cw*.056),dtW=MAX_STK*(dr*2)+(MAX_STK-1)*3;
      const dx0=sx+cw/2-dtW/2+dr,dy=sy+ch-11;
      for(let d=0;d<MAX_STK;d++){g.fillStyle(d<this.stock[i]?p.tint:0x334155,1);g.fillCircle(dx0+d*(dr*2+3),dy,dr);}
      if(!full){
        g.fillStyle(0x1E3A5F,1);g.fillRoundedRect(sx+6,sy+ch-21,cw-12,5,2.5);
        g.fillStyle(0x22C55E,1);g.fillRoundedRect(sx+6,sy+ch-21,(cw-12)*rp,5,2.5);
        g.fillStyle(0x000000,.35);g.fillRoundedRect(sx+6,sy+ch-16,cw-12,16,3);
      }
    });
  }

  createHUD(W,H){
    this.hudGfx=this.add.graphics().setDepth(100);
    this.hudGfx.fillGradientStyle(0x1a0800,0x1a0800,0x2d1200,0x2d1200,1);
    this.hudGfx.fillRect(0,0,W,56);
    this.hudGfx.lineStyle(2,0xF5A623,1);
    this.hudGfx.beginPath();this.hudGfx.moveTo(0,56);this.hudGfx.lineTo(W,56);this.hudGfx.strokePath();
    // Stat pills
    this.drawHUDPill(this.hudGfx,10,28,120,34);
    this.drawHUDPill(this.hudGfx,W/2-55,28,110,34);
    this.drawHUDPill(this.hudGfx,W-130,28,120,34);
    this.tMoney=this.add.text(70,28,'R$ 0',{fontFamily:'Nunito',fontSize:'16px',fontStyle:'bold',color:'#FBB724'}).setOrigin(.5).setDepth(101);
    this.tSales=this.add.text(W/2,28,'0 vendas',{fontFamily:'Nunito',fontSize:'13px',fontStyle:'bold',color:'#A5F3FC'}).setOrigin(.5).setDepth(101);
    this.tTimer=this.add.text(W-70,28,'90s',{fontFamily:'Nunito',fontSize:'16px',fontStyle:'bold',color:'#FCA5A5'}).setOrigin(.5).setDepth(101);
    this.tCombo=this.add.text(W/2,46,'',{fontFamily:'Nunito',fontSize:'11px',fontStyle:'bold',color:'#F97316'}).setOrigin(.5,1).setDepth(101).setAlpha(0);
  }
  drawHUDPill(g,cx,cy,w,h){g.fillStyle(0x000000,.3);g.fillRoundedRect(cx-w/2,cy-h/2,w,h,10);g.lineStyle(1,0xF5A623,.2);g.strokeRoundedRect(cx-w/2,cy-h/2,w,h,10);}

  updateComboHUD(){
    if(this.combo>=3){this.tCombo.setText(`🔥 Combo ${this.combo}x`).setAlpha(1);}else{this.tCombo.setAlpha(0);}
  }

  burst(x,y,isCombo){
    this.coinEmit.explode(isCombo?16:9,x,y);
    this.starEmit.explode(isCombo?8:4,x,y);
    this.sparkEmit.explode(isCombo?20:10,x,y);
    if(isCombo)this.cameras.main.flash(140,255,200,0,false);
  }

  tapStall(idx){
    if(!this.running)return;
    const p=PRODUCTS[idx];
    const{cols,mg,gap,cw,ch,aY}=this.sLayout;
    const col=idx%cols,row=Math.floor(idx/cols);
    const cx=mg+col*(cw+gap)+cw/2,cy=aY+row*(ch+gap)+ch/2;
    if(this.stock[idx]===0){
      const cost=p.restockCost*3;
      if(this.money>=cost){this.money-=cost;this.stock[idx]=3;this.rstProg[idx]=0;playRestock();this.floats.push(new FloatText(this,`📦 Reposto! −R$${cost}`,cx,cy-10,'#FB923C',14));}
      else{playFail();this.floats.push(new FloatText(this,'💸 Sem dinheiro!',cx,cy-10,'#F87171',13));}
      return;
    }
    const wo=this.customers.find(c=>c.state==='wait'&&c.prodIdx===idx);
    if(wo){
      this.stock[idx]--;
      this.combo++;if(this.combo>this.maxCombo)this.maxCombo=this.combo;
      this.updateComboHUD();
      const mult=wo.isRush?2:1,cbm=this.combo>=3?1.5:1;
      const earned=Math.round(p.sell*mult*cbm);
      this.money+=earned;this.sales++;
      wo.state='ok';wo.speed=2.2;
      wo.msgTxt=`😄 Obrigado!`;wo.msgTimer=1500;
      playSell(wo.isRush,this.combo>=3);
      if(this.combo===3)playCombo();
      this.burst(wo.x,wo.y-50,this.combo>=3);
      let ft=`+R$ ${earned}`;if(wo.isRush)ft+=' ⚡';if(this.combo>=3)ft+=' 🔥';
      this.floats.push(new FloatText(this,ft,wo.x,wo.y-110,wo.isRush?'#FB923C':this.combo>=3?'#FDE047':'#4ADE80',22));
    }else{
      this.combo=0;this.updateComboHUD();playFail();
      this.floats.push(new FloatText(this,'❌ Ninguém quer!',cx,aY+40,'#F87171',13));
    }
  }

  drawVendor(now){
    const g=this.vendorGfx;g.clear();
    const W=this.scale.width,H=this.scale.height;
    const vx=Math.min(W*.14,105),vy=H*.59;
    g.x=vx;g.y=vy;
    const aSwing=Math.sin(now*.003)*10;
    // Shadow
    g.fillStyle(0x000000,.2);g.fillEllipse(0,4,46,10);
    // Legs
    g.lineStyle(10,0x78350F,1);
    g.beginPath();g.moveTo(-5,0);g.lineTo(-8,30);g.strokePath();
    g.beginPath();g.moveTo( 5,0);g.lineTo( 8,30);g.strokePath();
    g.fillStyle(0x1a0a00,1);g.fillEllipse(-8,30,15,7);g.fillEllipse(8,30,15,7);
    // Apron
    g.fillStyle(0x1E3A8A,1);g.fillRect(-16,-6,32,10);
    g.lineStyle(5,0x1E3A8A,1);
    g.beginPath();g.moveTo(-6,-6);g.lineTo(-3,-24);g.strokePath();
    g.beginPath();g.moveTo( 6,-6);g.lineTo( 3,-24);g.strokePath();
    // Body
    g.fillStyle(0xFFFFFF,1);g.fillEllipse(0,-15,30,38);
    // Arms (swing via endpoint offset, no rotation)
    g.lineStyle(10,0xD4A574,1);
    g.beginPath();g.moveTo(-12,-10);g.lineTo(-22-aSwing,-32);g.strokePath();
    g.beginPath();g.moveTo( 12,-10);g.lineTo( 22+aSwing,-32);g.strokePath();
    // Counter
    g.fillStyle(0x8B5E3C,1);g.fillRoundedRect(-48,0,96,16,4);
    g.fillStyle(0xC8A96A,1);g.fillRect(-48,0,96,4);
    // Head
    g.fillStyle(0xD4A574,1);g.fillCircle(0,-55,16);
    // Hair bun
    g.fillStyle(0x2D1B00,1);g.fillCircle(0,-68,10);g.fillCircle(0,-70,8);
    // Headband
    g.fillStyle(0x1E3A8A,1);g.fillRect(-18,-72,36,6);
    // Eyes
    g.fillStyle(0x2D1B00,1);g.fillCircle(-5,-57,2.5);g.fillCircle(5,-57,2.5);
    g.fillStyle(0xFFFFFF,.7);g.fillCircle(-4,-58,1);g.fillCircle(6,-58,1);
    // Smile
    g.lineStyle(2.5,0x333333,1);
    g.beginPath();g.arc(0,-55,6,.1,Math.PI-.1,false);g.strokePath();
    // Name tag
    g.fillStyle(0xFFFFFF,.9);g.fillRoundedRect(-22,-2,44,12,4);
    g.lineStyle(1,0xD97706,1);g.strokeRoundedRect(-22,-2,44,12,4);
  }

  update(time,delta){
    const W=this.scale.width,H=this.scale.height;
    // Restock
    PRODUCTS.forEach((p,i)=>{if(this.stock[i]<MAX_STK){this.rstProg[i]+=delta;if(this.rstProg[i]>=p.restockTime){this.stock[i]++;this.rstProg[i]=0;}}});
    this.updateStalls();
    if(!this.running)return;
    // Timer
    this.timerMs-=delta;
    if(this.timerMs<=0){this.timerMs=0;this.running=false;playEnd();this.endGame();return;}
    // Flags + vendor
    this.flagOffset+=.6;
    drawFlagBanner(this.flagGfx,W,H,this.flagOffset);
    this.drawVendor(time);
    // Spawn
    const hasWait=this.customers.some(c=>c.state==='wait');
    if(!hasWait){this.spawnCooldown-=delta;if(this.spawnCooldown<=0){this.customers.push(new Customer(this,Math.floor(Math.random()*PRODUCTS.length)));this.spawnCooldown=1800+Math.random()*1200;}}
    // Update customers
    this.customers=this.customers.filter(c=>{c.update(delta,time);return c.alive;});
    // Float texts
    this.floats=this.floats.filter(f=>{f.update(delta);return f.alive;});
    // HUD
    this.tMoney.setText(`💰 R$ ${this.money.toFixed(0)}`);
    this.tSales.setText(`🛍 ${this.sales} venda${this.sales!==1?'s':''}`);
    const secs=Math.max(0,Math.ceil(this.timerMs/1000));
    this.tTimer.setText(`⏱ ${secs}s`).setColor(secs<=15?'#EF4444':secs<=30?'#F59E0B':'#FCA5A5');
  }

  endGame(){
    this.cameras.main.fade(500,0,0,0,false,(c,t)=>{
      if(t===1){
        // Clean up customer text objects
        this.customers.forEach(c=>c.destroyObjs());
        this.scene.start('Result',{money:this.money,sales:this.sales,maxCombo:this.maxCombo});
      }
    });
  }
}

// ═══════════════════════════════════════════
//  RESULT SCENE
// ═══════════════════════════════════════════
class ResultScene extends Phaser.Scene{
  constructor(){super('Result');}
  init(d){this.gd=d;}
  create(){
    this.cameras.main.fadeIn(500,0,0,0);
    const W=this.scale.width,H=this.scale.height;
    const{money,sales,maxCombo}=this.gd;
    // BG
    const bg=this.add.graphics();
    bg.fillGradientStyle(0x1a0800,0x1a0800,0x0D0500,0x0D0500,1);
    bg.fillRect(0,0,W,H);
    bg.lineStyle(1,0xF5A623,.07);
    for(let r=50;r<W;r+=60)bg.strokeCircle(W/2,H/2,r);

    let badge,title,msg,color;
    if(money>=320){badge='🏆';title='Feirante Mestre!';msg='Suas vendas iluminaram o Mercado Antônio Franco!';color='#FBB724';}
    else if(money>=180){badge='⭐';title='Comerciante Talentoso!';msg='Ótimas vendas! Você sabe escolher o produto certo na hora certa.';color='#A3E635';}
    else if(money>=90){badge='🛍️';title='Feirante em Crescimento!';msg='Bom começo! Continue praticando — cada produto tem sua hora certa.';color='#67E8F9';}
    else{badge='🌱';title='Aprendiz de Feirante!';msg='Continue vendendo! O Mercado de Aracaju tem muito a te ensinar.';color='#D4A574';}

    this.add.text(W/2,H*.13,badge,{fontSize:'72px'}).setOrigin(.5);
    this.add.text(W/2,H*.27,title,{fontFamily:'Nunito',fontSize:'26px',fontStyle:'bold',color:'#FEF3C7',stroke:'#2D1200',strokeThickness:4}).setOrigin(.5);

    // Stats card
    const panW=Math.min(340,W-30),panH=152,panX=(W-panW)/2,panY=H*.34;
    const pg=this.add.graphics();
    pg.fillStyle(0x000000,.4);pg.fillRoundedRect(panX+4,panY+4,panW,panH,16);
    pg.fillStyle(0x1A0800,1);pg.fillRoundedRect(panX,panY,panW,panH,16);
    pg.lineStyle(2,h2n(color),.8);pg.strokeRoundedRect(panX,panY,panW,panH,16);
    // Dividers
    pg.lineStyle(1,0xFFFFFF,.07);
    pg.beginPath();pg.moveTo(panX+panW/3,panY+16);pg.lineTo(panX+panW/3,panY+panH-16);pg.strokePath();
    pg.beginPath();pg.moveTo(panX+panW*2/3,panY+16);pg.lineTo(panX+panW*2/3,panY+panH-16);pg.strokePath();
    [['💰 Faturamento',`R$ ${money.toFixed(2)}`],['🛍️ Vendas',`${sales}`],['🔥 Combo Máx',`${maxCombo}×`]].forEach(([label,val],i)=>{
      const cx=panX+panW/6+i*(panW/3);
      this.add.text(cx,panY+40,label,{fontFamily:'Nunito',fontSize:'11px',color:'#D4A574'}).setOrigin(.5);
      this.add.text(cx,panY+74,val,{fontFamily:'Nunito',fontSize:'22px',fontStyle:'bold',color}).setOrigin(.5);
    });

    this.add.text(W/2,H*.59,msg,{fontFamily:'Nunito',fontSize:'14px',color:'#CBD5E1',wordWrap:{width:W-32},align:'center'}).setOrigin(.5);
    this.add.text(W/2,H*.685,'🏛️ Mercado Antônio Franco · Aracaju, Sergipe\nUm dos mercados históricos mais famosos do Nordeste.',{fontFamily:'Nunito',fontSize:'11px',color:'#78350F',backgroundColor:'rgba(255,220,150,.07)',padding:{x:12,y:6},wordWrap:{width:W-32},align:'center'}).setOrigin(.5);

    // Play again button
    const bw=240,bh=58,bx=(W-bw)/2,by=H*.79;
    const bg2=this.add.graphics().setInteractive(new Phaser.Geom.Rectangle(bx,by,bw,bh),Phaser.Geom.Rectangle.Contains);
    bg2.fillStyle(0x000000,.4);bg2.fillRoundedRect(bx+4,by+4,bw,bh,29);
    bg2.fillGradientStyle(0xF5A623,0xF5A623,0x92400E,0x92400E,1);bg2.fillRoundedRect(bx,by,bw,bh,29);
    bg2.lineStyle(2,0xFDE68A,.7);bg2.strokeRoundedRect(bx,by,bw,bh,29);
    const bt=this.add.text(W/2,by+bh/2,'Vender de Novo! 🛍️',{fontFamily:'Nunito',fontSize:'19px',fontStyle:'bold',color:'#FFF',stroke:'#92400E',strokeThickness:3}).setOrigin(.5);
    this.tweens.add({targets:bt,scaleX:1.04,scaleY:1.04,yoyo:true,repeat:-1,duration:720,ease:'Sine.easeInOut'});
    const goMenu=()=>this.cameras.main.fade(350,0,0,0,false,(c,t)=>{if(t===1)this.scene.start('Menu');});
    bg2.on('pointerdown',goMenu);
    bt.setInteractive().on('pointerdown',goMenu);

    // Confetti burst after fade in
    this.time.delayedCall(300,()=>{
      this.add.particles(W/2,H*.2,'star',{speed:{min:100,max:350},angle:{min:200,max:340},scale:{start:1.5,end:0},alpha:{start:1,end:0},lifespan:{min:600,max:1200},gravityY:300,emitting:false}).setDepth(90).explode(28);
      this.add.particles(W/2,H*.2,'coin',{speed:{min:80,max:300},angle:{min:200,max:340},scale:{start:1.3,end:0},alpha:{start:1,end:0},lifespan:{min:800,max:1400},gravityY:280,emitting:false}).setDepth(90).explode(22);
    });
  }
}
